name: OQuaRE QA

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Evaluate ontologies
    steps:
      - uses: actions/checkout@v2
      # Configuration
      # Java setup
      - uses: actions/setup-java@v2
        with:
          distribution: 'temurin'
          java-version: '8'
      # Python setup
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: OQuaRE module
        uses: Emdien/oquare-metrics@v2.1
        with:
          ontology-folders: ontology
          contents-folder: QA
